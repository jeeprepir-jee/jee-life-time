name: Validate app
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check ai-engine.js
          node --check video-inbox.js
          node --check study-manager.js
          node --check reels.js
          node --check extension/content.js
          node --check extension/service-worker.js
          node --check extension/popup.js
          node --check api/reels/capture.js
          node --check api/reels/analyze.js
          node --check api/reels/list.js
          node --check local-assistant/server.mjs
      - name: Validate extension and package JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
      - name: Verify app and Reel Analyzer files
        run: |
          test -s index.html
          test -s manifest.json
          test -s sw.js
          test -s study-manager.css
          test -s reels.html
          test -s reels.css
          test -s reels.js
          test -s api/reels/capture.js
          test -s api/reels/analyze.js
          test -s api/reels/list.js
          test -s supabase/reel-analyzer.sql
