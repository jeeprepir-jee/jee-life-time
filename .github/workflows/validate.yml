name: Validate app
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check ai-engine.js
          node --check video-inbox.js
          node --check study-manager.js
          node --check local-assistant/server.mjs
      - name: Verify PWA files
        run: |
          test -s index.html
          test -s manifest.json
          test -s sw.js
          test -s study-manager.css
